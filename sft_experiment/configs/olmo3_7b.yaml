seed: 42

model:
  name_or_path: allenai/Olmo-3-1025-7B
  trust_remote_code: false
  smoke: false
  bf16: true

data:
  dataset_name: allenai/Dolci-Instruct-SFT
  train_split: train
  sample_size: 20000
  eval_size: 2000

training:
  output_dir: /workspace/sft_experiment/runs/olmo3-7b
  num_train_epochs: 8
  label_smoothing: 0.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  max_length: 1024
  assistant_only_loss: true
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: adamw_torch_fused
  logging_steps: 10
  save_total_limit: 8

metrics:
  measure_kl: true
